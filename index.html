<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>猫猫搭档 · 星回小窝</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="phone">
    <!-- 顶部栏 -->
    <div class="new-top-bar">
        <div class="top-left" id="starSpaceBtn">
            <div class="avatar-small" id="partnerAvatar">⭐</div>
            <span class="name" id="partnerName">沈星回</span>
        </div>
        <div class="top-center">
            <button class="bubble-btn" id="leisureBubbleBtn">🫧</button>
        </div>
        <div class="top-right" id="mySpaceBtn">
            <span class="name" id="myNickname">我</span>
            <div class="avatar-small" id="myAvatar">🐱</div>
        </div>
    </div>

    <div class="content-panel">
        <!-- 聊天页面 -->
        <div id="chat-page" class="page active">
            <div class="chat-area" id="chatArea"></div>
            <div class="bottom-bar">
                <div class="input-row">
                    <button class="dice-btn" id="diceBtn">🎲</button>
                    <input type="text" id="msgInput" placeholder="输入消息...">
                    <button id="actionBtn" class="action-btn plus-mode">➕</button>
                    <button id="sendMsgBtn" style="display: none;"></button>
                </div>
                <div class="bottom-actions">
                    <button class="action-btn" id="openEmojiBtn">😊 通用表情</button>
                    <button class="action-btn" id="openStickerBtn1">🐱 猫猫搭档1</button>
                    <button class="action-btn" id="openStickerBtn2">🐱 猫猫搭档2</button>
                    <input type="file" id="fileInput" class="file-input-hidden" multiple>
                </div>
            </div>
        </div>

        <!-- 休闲页面 -->
        <div id="leisure-page" class="page">
            <div class="leisure-page" id="leisureContainer"></div>
        </div>

        <!-- 他的空间（沈星回） -->
        <div id="his-space-page" class="page">
            <div class="scroll-page">
                <h3>⭐ 沈星回的空间</h3>
                <!-- 字卡管理 -->
                <div class="card-section">
                    <h4>📚 字卡管理</h4>
                    <div id="groupsContainer"></div>
                    <button id="addGroupBtn">+ 新建分组</button>
                    <div class="card-input-area">
                        <textarea id="cardBulkInput" class="card-textarea" rows="4" placeholder="每行一条回复内容"></textarea>
                        <div class="add-method-buttons">
                            <button id="updateCardsBtn">📥 从 GitHub 更新字卡</button>
                            <button id="addMultiLineBtn">批量添加回复</button>
                            <button id="clearTextareaBtn" class="danger-btn">清空内容</button>
                        </div>
                    </div>
                </div>
                <!-- 回复设置 -->
                <div class="reply-section">
                    <h4>⚡ 回复设置</h4>
                    <div class="setting-row"><label>回复最慢时长(秒):</label><input type="number" id="maxDelaySec" value="300"></div>
                    <div class="setting-row"><label>回复最快时长(秒):</label><input type="number" id="minDelaySec" value="1"></div>
                    <div class="setting-row"><label>主动发消息间隔(分钟):</label><input type="number" id="activeDelayMin" value="5"></div>
                    <div class="reply-preview">📚 当前字卡库共有 <span id="totalReplyCount">0</span> 条回复</div>
                    <button id="saveReplySettings">保存设置</button>
                </div>
                <!-- 他的其他功能 -->
                <div class="other-section">
                    <h4>📔 其他</h4>
                    <button id="hisDiaryBtn" class="demo-btn">📔 他的日记（开发中）</button>
                    <button id="hisMomentsBtn" class="demo-btn">🌐 他的朋友圈（开发中）</button>
                    <button id="hisCollectionBtn" class="demo-btn">❤️ 他的收藏（开发中）</button>
                </div>
            </div>
        </div>

        <!-- 我的空间（用户） -->
        <div id="my-space-page" class="page">
            <div class="scroll-page">
                <h3>🐱 我的空间</h3>
                <!-- 个人设置 -->
                <div class="profile-section">
                    <h4>👤 个人设置</h4>
                    <div class="setting-row"><label>我的昵称:</label><input type="text" id="myNicknameInput" placeholder="我"></div>
                    <div class="setting-row"><label>我的头像文字:</label><input type="text" id="myAvatarText" placeholder="🐱" maxlength="6"></div>
                    <div class="setting-row"><label>对方昵称:</label><input type="text" id="partnerNicknameInput" placeholder="沈星回"></div>
                    <div class="setting-row"><label>对方头像文字:</label><input type="text" id="partnerAvatarText" placeholder="⭐" maxlength="6"></div>
                    <button id="saveProfileBtn">💾 保存设置</button>
                </div>
                <!-- 数据管理 -->
                <div class="data-section">
                    <h4>📦 数据管理</h4>
                    <div style="margin: 12px 0; display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="file" id="importFileInput" accept=".json,.txt">
                        <button id="importDataBtn">导入数据</button>
                        <button id="exportFullData">导出数据(.json)</button>
                        <button id="clearAllChats" class="danger-btn">清空聊天记录</button>
                        <button id="resetAllData" class="danger-btn">恢复出厂设置</button>
                    </div>
                </div>
                <!-- 我的其他功能 -->
                <div class="other-section">
                    <h4>📔 其他</h4>
                    <button id="myDiaryBtn" class="demo-btn">📔 我的日记（开发中）</button>
                    <button id="myMomentsBtn" class="demo-btn">🌐 我的朋友圈（开发中）</button>
                    <button id="myCollectionBtn" class="demo-btn">❤️ 我的收藏（开发中）</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="data/defaultCards.js"></script>
<script src="modules/utils.js"></script>
<script src="modules/chat.js"></script>
<script src="modules/card.js"></script>
<script src="modules/leisure.js?v=2"></script>
<script src="modules/sync.js"></script> 
<script src="modules/profile.js"></script>
<script src="script.js"></script>
</body>
</html>
